services:
  dashboard:
    build: .
    command: uvicorn app.dashboard.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./options_alpha.db:/app/options_alpha.db

  monitor:
    build: .
    command: python scripts/monitor_positions.py
    env_file:
      - .env
    volumes:
      - ./options_alpha.db:/app/options_alpha.db
    depends_on:
      - dashboard
